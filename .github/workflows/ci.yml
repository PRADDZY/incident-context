name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: printf 'BACKEND_TOKEN=ci-placeholder\n' > .dev.vars
      - run: npm run cf:types
      - run: npm run typecheck:worker
